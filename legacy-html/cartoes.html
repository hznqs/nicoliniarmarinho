<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cartões | Nicolini Armarinho</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/cartoes.css">
</head>
<body>
    <div class="app-container">
        
        <!-- Mobile Overlay -->
        <div class="sidebar-overlay" id="sidebar-overlay"></div>

        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <img id="store-logo-sidebar" src="" alt="Logo" style="display: none; max-width: 24px; max-height: 24px; border-radius: 4px;">
                    <i id="store-icon-sidebar" data-lucide="scissors"></i>
                    <span id="store-name-sidebar">Armarinho</span>
                </div>
                <button class="sidebar-close" id="sidebar-close">
                    <i data-lucide="x"></i>
                </button>
            </div>
            <nav class="sidebar-nav">
                <a href="index.html" class="nav-item">
                    <i data-lucide="layout-dashboard"></i>
                    <span>Dashboard</span>
                </a>
                <a href="vendas.html" class="nav-item">
                    <i data-lucide="trending-up"></i>
                    <span>Vendas</span>
                </a>
                <a href="fornecedores.html" class="nav-item">
                    <i data-lucide="truck"></i>
                    <span>Fornecedores</span>
                </a>
                <a href="compras.html" class="nav-item">
                    <i data-lucide="shopping-bag"></i>
                    <span>Compras</span>
                </a>
                <a href="cartoes.html" class="nav-item active">
                    <i data-lucide="credit-card"></i>
                    <span>Cartões</span>
                </a>
                <a href="configuracoes.html" class="nav-item">
                    <i data-lucide="settings"></i>
                    <span>Configurações</span>
                </a>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="topbar">
                <div class="topbar-left">
                    <button class="menu-toggle" id="menu-toggle">
                        <i data-lucide="menu"></i>
                    </button>
                    <div class="topbar-title">
                        <h1 id="page-title">Meus Cartões</h1>
                        <p id="page-subtitle" class="text-muted">Gestão de faturas e limites</p>
                    </div>
                </div>
                <div class="topbar-actions">
                    <button class="btn btn-primary" onclick="Shared.openModal('modal-cartao')">
                        <i data-lucide="plus"></i>
                        <span>Adicionar Cartão</span>
                    </button>
                </div>
            </header>

            <div class="content-area">
                <div class="card">
                    <div class="card-header flex-between">
                        <h3>Cartões de Crédito Cadastrados</h3>
                    </div>
                    <div class="cards-grid" id="grid-cartoes">
                        <!-- Populated by JS -->
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Modal Cartão -->
    <div class="modal-overlay hidden" id="modal-cartao">
        <div class="modal">
            <div class="modal-header">
                <h3>Adicionar Cartão</h3>
                <button class="btn-close" onclick="Shared.closeModal('modal-cartao')"><i data-lucide="x"></i></button>
            </div>
            <form id="form-cartao">
                <div class="modal-body">
                    <div class="form-group">
                        <label>Nome do Cartão (Apelido)</label>
                        <input type="text" id="cartao-nome" required placeholder="Ex: Nubank PJ">
                    </div>
                    <div class="grid-2-cols">
                        <div class="form-group">
                            <label>Últimos 4 dígitos</label>
                            <input type="text" id="cartao-digitos" maxlength="4" pattern="\d{4}" required placeholder="1234">
                        </div>
                        <div class="form-group">
                            <label>Limite Total (R$)</label>
                            <input type="number" id="cartao-limite" step="0.01" min="0" required placeholder="0.00">
                        </div>
                    </div>
                    <div class="grid-2-cols">
                        <div class="form-group">
                            <label>Dia Fechamento</label>
                            <input type="number" id="cartao-fechamento" min="1" max="31" required placeholder="Ex: 7">
                        </div>
                        <div class="form-group">
                            <label>Dia Vencimento</label>
                            <input type="number" id="cartao-vencimento" min="1" max="31" required placeholder="Ex: 15">
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline" onclick="Shared.closeModal('modal-cartao')">Cancelar</button>
                    <button type="submit" class="btn btn-primary">Salvar Cartão</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal Fatura -->
    <div class="modal-overlay hidden" id="modal-fatura">
        <div class="modal" style="max-width: 600px;">
            <div class="modal-header">
                <div>
                    <h3 id="fatura-titulo">Fatura do Cartão</h3>
                    <p class="text-muted" style="font-size: 0.875rem; margin-top: 4px;" id="fatura-subtitulo">Extrato de todas as compras</p>
                </div>
                <div style="display: flex; gap: 1rem; align-items: center;">
                    <select id="fatura-mes" class="custom-select" style="width: 160px;" onchange="window.Cartoes.filterFatura()">
                        <!-- Preenchido via JS -->
                    </select>
                    <button class="btn-close" onclick="Shared.closeModal('modal-fatura')"><i data-lucide="x"></i></button>
                </div>
            </div>
            <div class="modal-body" style="max-height: 400px; overflow-y: auto;">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>Data</th>
                            <th>Valor</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody id="tbody-fatura">
                        <!-- Populated by JS -->
                    </tbody>
                </table>
            </div>
            <div class="modal-footer" style="justify-content: space-between;">
                <button type="button" class="btn btn-outline" style="border-color: #10b981; color: #10b981;" onclick="window.Cartoes.exportarFatura()">
                    <i data-lucide="file-spreadsheet"></i> Exportar Excel
                </button>
                <div style="display: flex; gap: 1rem; align-items: center;">
                    <span style="color: var(--text-muted);">Total da fatura:</span>
                    <span id="fatura-total" style="font-size: 1.25rem; font-weight: 700; color: var(--primary);">R$ 0,00</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script type="module" src="js/store.js"></script>
    <script type="module" src="js/shared.js"></script>
    <script type="module" src="js/cartoes.js"></script>
</body>
</html>
